name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-verified.txt
      - name: Install development dependencies
        run: |
          python -m pip install -c requirements-verified.txt setuptools wheel
          python -m pip install --no-build-isolation -c requirements-verified.txt -e '.[dev]'
      - name: Require actual HTTP runtime dependencies
        run: python -c "import flask, waitress; from app import create_app; create_app()"
      - name: Static quality checks
        run: |
          python -m compileall -q app tests scripts
          python -m ruff check .
          python -m ruff format --check .
          node --version  # Required by clipboard async-regression test
      - name: Unit, Flask, Waitress and HTTP regression tests
        run: >-
          python scripts/strict_pytest.py --require-server-tests --ignore=tests/test_browser_flow.py
          --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Build and clean-install distributable wheel
        run: |
          SOURCE_DATE_EPOCH=1762819200 python -m build --wheel --no-isolation
          python -m venv "$RUNNER_TEMP/coffee-wheel-venv"
          "$RUNNER_TEMP/coffee-wheel-venv/bin/python" -m pip install -c requirements-verified.txt dist/*.whl
          cd "$RUNNER_TEMP"
          APP_DB_PATH="$RUNNER_TEMP/coffee-wheel.sqlite3" \
            "$RUNNER_TEMP/coffee-wheel-venv/bin/python" -c "from app import create_app; assert create_app().test_client().get('/health').status_code == 200"

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-verified.txt
      - name: Install browser integration dependencies
        run: |
          python -m pip install -c requirements-verified.txt setuptools wheel
          python -m pip install --no-build-isolation -c requirements-verified.txt -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Definitive no-skips release certification
        run: python scripts/verify_release.py --report .ci_artifacts/release-evidence.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: verified-flask-browser-screenshots
          path: |
            .ci_artifacts/*.png
            .ci_artifacts/release-evidence.json
          include-hidden-files: true
          if-no-files-found: error
